<div class="vault-page">
  <mat-card class="item-form-card">
    <mat-card-header>
      <mat-card-title>New vault item</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Label</mat-label>
          <input matInput formControlName="label" placeholder="e.g. Chase checking" />
          @if (form.controls.label.hasError('required')) {
            <mat-error>Label is required.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Type</mat-label>
          <mat-select formControlName="itemType">
            @for (type of itemTypes; track type) {
              <mat-option [value]="type">{{ type }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div formArrayName="fields" class="fields">
          @for (field of fields.controls; track $index) {
            <div [formGroupName]="$index" class="field-row">
              <mat-form-field appearance="outline">
                <mat-label>Field name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. Username" />
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Value</mat-label>
                <input matInput formControlName="value" />
              </mat-form-field>
              <button
                mat-icon-button
                type="button"
                (click)="removeField($index)"
                [disabled]="fields.length === 1"
                aria-label="Remove field"
              >
                <mat-icon>remove_circle_outline</mat-icon>
              </button>
            </div>
          }
        </div>

        <button mat-stroked-button type="button" (click)="addField()">
          <mat-icon>add</mat-icon>
          Add field
        </button>

        @if (errorMessage(); as message) {
          <p class="error-text">{{ message }}</p>
        }

        <div class="actions">
          <a mat-button routerLink="/vault">Cancel</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
            @if (loading()) {
              <mat-progress-spinner diameter="20" mode="indeterminate" />
            } @else {
              Save
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
