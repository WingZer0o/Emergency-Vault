<div class="vault-page">
  <div class="vault-header">
    <div>
      <h1>My vault</h1>
      <br/>
      <div class="k vault-subline">{{ items().length }} record{{ items().length === 1 ? '' : 's' }}</div>
    </div>
    <div class="vault-header-actions">
      <a mat-stroked-button routerLink="/vault/sharing">Emergency access</a>
      <a mat-stroked-button routerLink="/vault/shared-with-me">Shared with me</a>
      <a mat-flat-button color="primary" routerLink="/vault/items/new">
        <mat-icon>add</mat-icon>
        New item
      </a>
    </div>
  </div>

  @if (loading()) {
    <mat-progress-spinner diameter="32" mode="indeterminate" />
  } @else if (errorMessage(); as message) {
    <p class="error-text">{{ message }}</p>
  } @else {
    <div class="vault-body">
      <app-search-query-bar [(searchQuery)]="searchQuery"></app-search-query-bar>

      <table mat-table [dataSource]="pagedItems()" class="records-table">
        <ng-container matColumnDef="record">
          <th mat-header-cell *matHeaderCellDef>Record</th>
          <td mat-cell *matCellDef="let item">
            <div class="record-label">{{ item.label }}</div>
            <div class="k record-updated">{{ updatedLabel(item) }}</div>
          </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let item">{{ item.itemType }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item" class="actions-cell">
            <button mat-icon-button (click)="viewViewers(item.id, $event)" aria-label="Who viewed this item">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteItem(item.id, $event)" aria-label="Delete item">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let item; columns: displayedColumns" class="record-row" (click)="openItem(item.id)"></tr>
      </table>

      <app-paginator [length]="filteredItems().length" [(pageIndex)]="pageIndex" />
    </div>
  }
</div>
