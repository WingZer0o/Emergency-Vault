<div class="vault-page">
  <div class="vault-header">
    <h1>My vault</h1>
    <div class="vault-header-actions">
      <a mat-stroked-button routerLink="/vault/sharing">Emergency access</a>
      <a mat-stroked-button routerLink="/vault/shared-with-me">Shared with me</a>
      <a mat-flat-button color="primary" routerLink="/vault/items/new">
        <mat-icon>add</mat-icon>
        New item
      </a>
    </div>
  </div>

  @if (loading()) {
    <mat-progress-spinner diameter="32" mode="indeterminate" />
  } @else if (errorMessage(); as message) {
    <p class="error-text">{{ message }}</p>
  } @else {
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <form>
            <mat-form-field appearance="fill">
              <mat-label>Search</mat-label>
              <input matInput [(ngModel)]="searchQuery" name="searchQuery" />
            </mat-form-field>
          </form>
        </mat-card-title>
      </mat-card-header>
      <mat-list>
        @for (item of pagedItems(); track item.id; let last = $last) {
          <mat-list-item matRipple [matRippleColor]="'rgba(255, 0, 0, 0.1)'" (click)="openItem(item.id)" class="vault-item">
            <span matListItemTitle>{{ item.label }}</span>
            <span matListItemLine>{{ item.itemType }}</span>
            <button
              mat-icon-button
              matListItemMeta
              (click)="viewViewers(item.id, $event)"
              aria-label="Who viewed this item"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button matListItemMeta (click)="deleteItem(item.id, $event)" aria-label="Delete item">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-list-item>
          @if (!last) {
            <mat-divider></mat-divider>
          }
        }
      </mat-list>
      <app-paginator [length]="filteredItems().length" [(pageIndex)]="pageIndex" />
    </mat-card>
  }
</div>
