<div class="billing-settings-page">
  <div class="page-header">
    <h1>Billing settings</h1>
  </div>

  @if (loading()) {
    <mat-progress-spinner diameter="32" mode="indeterminate" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Yearly price (dollars)</mat-label>
        <input matInput type="number" min="1" step="0.01" formControlName="yearlyPriceDollars" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Currency</mat-label>
        <input matInput formControlName="currency" maxlength="8" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        @if (saving()) {
          <mat-progress-spinner diameter="18" mode="indeterminate" />
        } @else {
          Save
        }
      </button>

      @if (errorMessage(); as message) {
        <p class="error-text">{{ message }}</p>
      }
      @if (successMessage(); as message) {
        <p class="hint-text">{{ message }}</p>
      }
    </form>
  }
</div>
