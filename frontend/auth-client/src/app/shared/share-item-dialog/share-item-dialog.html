<h2 mat-dialog-title>Share "{{ data.itemLabel }}"</h2>
<form [formGroup]="form" (ngSubmit)="onShare()">
  <mat-dialog-content>
    <p>Only this item will be shared - not the rest of your vault.</p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Their email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.hasError('required')) {
        <mat-error>Email is required.</mat-error>
      } @else if (form.controls.email.hasError('email')) {
        <mat-error>Enter a valid email.</mat-error>
      }
    </mat-form-field>

    <mat-radio-group formControlName="canEdit" class="permission-group">
      <mat-radio-button [value]="false">View only</mat-radio-button>
      <mat-radio-button [value]="true">Can edit</mat-radio-button>
    </mat-radio-group>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit">Share</button>
  </mat-dialog-actions>
</form>
