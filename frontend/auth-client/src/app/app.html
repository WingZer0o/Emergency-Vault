@if (!isLandingPage()) {
  <mat-toolbar>
    <a routerLink="/" class="brand-link">Emergency Vault</a>
    <span class="spacer"></span>
    <button
      mat-icon-button
      [matMenuTriggerFor]="themeMenu"
      aria-label="Change color theme"
      [matTooltip]="'Theme: ' + themeService.mode()"
    >
      <mat-icon>{{ themeIcons[themeService.mode()] }}</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu">
      <button mat-menu-item (click)="setThemeMode('light')">
        <mat-icon>light_mode</mat-icon>
        <span>Light</span>
      </button>
      <button mat-menu-item (click)="setThemeMode('dark')">
        <mat-icon>dark_mode</mat-icon>
        <span>Dark</span>
      </button>
      <button mat-menu-item (click)="setThemeMode('system')">
        <mat-icon>brightness_auto</mat-icon>
        <span>System</span>
      </button>
    </mat-menu>
    @if (authService.isAuthenticated()) {
      <span class="user-email">{{ authService.currentUser()?.email }}</span>
      <button mat-icon-button [matMenuTriggerFor]="navMenu" aria-label="Open navigation menu">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #navMenu="matMenu">
        <a mat-menu-item routerLink="/dashboard">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a mat-menu-item routerLink="/vault">
          <mat-icon>lock</mat-icon>
          <span>Vault</span>
        </a>
        <a mat-menu-item routerLink="/billing">
          <mat-icon>payments</mat-icon>
          <span>Billing</span>
        </a>
        @if (authService.hasRole('Admin')) {
          <a mat-menu-item routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Admin</span>
          </a>
        }
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    }
  </mat-toolbar>
}

<router-outlet />
