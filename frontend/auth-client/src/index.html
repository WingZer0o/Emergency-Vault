<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emergency Vault</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Applies the saved theme mode before first paint so the page doesn't flash the wrong
      // color scheme; ThemeService takes over once Angular bootstraps. Kept in sync with the
      // 'theme-mode' key read/written by ThemeService (core/services/theme.service.ts).
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode');
          document.documentElement.style.colorScheme =
            mode === 'light' || mode === 'dark' ? mode : 'light dark';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
