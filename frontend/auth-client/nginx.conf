server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API container - avoids CORS and lets the httpOnly
    # refresh-token cookie flow without cross-site cookie restrictions.
    location /api/ {
        # Vault item file attachments can approach SQL Server's varbinary(max) ceiling (~2GB);
        # nginx's 1MB default would otherwise reject those uploads before they reach the API.
        client_max_body_size 2048m;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
