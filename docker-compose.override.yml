# Automatically merged by `docker compose up` (no extra flags needed). Swaps the api and
# frontend services from their production multi-stage build to a `dev` stage that bind-mounts
# the source and runs `dotnet watch` / `ng serve` so edits on the host hot-reload in the
# container. To run the production-like build instead: `docker compose -f docker-compose.yml up`.
services:
  api:
    env_file:
      - path: ./.env
    build:
      target: dev
    # First-boot bind-mount attachment on Docker Desktop can occasionally race with
    # dotnet watch starting; auto-restart rather than requiring a manual `docker compose up`.
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./backend:/src
      - nuget_cache:/root/.nuget/packages
      - api_bin:/src/src/AuthSystem.Api/bin
      - api_obj:/src/src/AuthSystem.Api/obj
      - application_bin:/src/src/AuthSystem.Application/bin
      - application_obj:/src/src/AuthSystem.Application/obj
      - infrastructure_bin:/src/src/AuthSystem.Infrastructure/bin
      - infrastructure_obj:/src/src/AuthSystem.Infrastructure/obj
      - domain_bin:/src/src/AuthSystem.Domain/bin
      - domain_obj:/src/src/AuthSystem.Domain/obj

  frontend:
    build:
      target: dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/auth-client:/app
      - frontend_node_modules:/app/node_modules

volumes:
  nuget_cache:
  frontend_node_modules:
  api_bin:
  api_obj:
  application_bin:
  application_obj:
  infrastructure_bin:
  infrastructure_obj:
  domain_bin:
  domain_obj:
