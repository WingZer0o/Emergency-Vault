name: Deploy

# Backend and frontend deploy on every push to main, backend first (deploy_frontend has a hard
# `needs: deploy_backend` dependency below so the API is always live before the SPA that calls it).
# Tests also run on the PR (see pr-tests.yml) as a required check before merge, but this workflow
# re-runs them itself as a final gate right before deploying (e.g. an admin merge that bypassed
# the required check should not skip straight to production).
# Each job's real work is skipped via paths-filter when its own tree didn't change, but the job
# itself still runs so the ordering dependency always resolves.
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changed paths
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/auth-client/**"

  backend_tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        working-directory: backend
        run: dotnet test EmergencyVault.slnx

  frontend_tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    name: Frontend Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and test
        working-directory: frontend/auth-client
        run: |
          npm ci
          npm test

  deploy_backend:
    needs: [changes, backend_tests]
    if: needs.changes.outputs.backend == 'true' && needs.backend_tests.result == 'success'
    runs-on: ubuntu-latest
    name: Deploy Backend (Container App)
    steps:
      - uses: actions/checkout@v4

      # Federated OIDC login - no client secret stored in GitHub.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACR Tasks builds the image cloud-side - no docker daemon or registry credentials needed
      # on the runner.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry ${{ vars.AZURE_CONTAINER_REGISTRY }} \
            --image backend:${{ github.sha }} \
            --file backend/src/EmergencyVault.Api/Dockerfile \
            --target final \
            backend

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/backend:${{ github.sha }}

  deploy_frontend:
    needs: [changes, frontend_tests, deploy_backend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend_tests.result == 'success' &&
      (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped')
    runs-on: ubuntu-latest
    name: Deploy Frontend (Static Web App)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and build
        working-directory: frontend/auth-client
        run: |
          npm ci
          npm run build:azure
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/auth-client/dist/auth-client/browser"
          output_location: ""
          skip_app_build: true

  build_desktop_installer:
    needs: [changes, frontend_tests, deploy_backend]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend_tests.result == 'success' &&
      (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped')
    runs-on: windows-latest
    name: Build Desktop Installer
    permissions:
      contents: write # job-level override: needs to create a tag + release, unlike the rest of the workflow
      id-token: write # needed for the OIDC azure/login step below (job-level permissions replace, not merge, the workflow defaults)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to compute the next version

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x" # deno desktop requires >=2.9; latest 2.x is 2.9.6

      - name: Determine next version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'desktop-v*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            ver=${latest#desktop-v}
            IFS='.' read -r major minor patch <<< "$ver"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$next" >> "$GITHUB_OUTPUT"

      - name: Stamp version into installer script
        shell: bash
        working-directory: frontend/auth-client
        run: sed -i "s/^AppVersion=.*/AppVersion=${{ steps.version.outputs.version }}/" installer/EmergencyVault.iss

      - name: Install deps and build Angular app
        working-directory: frontend/auth-client
        run: |
          npm ci
          npm run build

      - name: Compile desktop binary
        working-directory: frontend/auth-client
        run: deno task desktop-build:prod

      - name: Sign desktop binary
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: emergency-vault
          certificate-profile-name: emergency-vault-public
          files-folder: ${{ github.workspace }}/frontend/auth-client/emergency-vault
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: frontend/auth-client/installer/EmergencyVault.iss

      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: emergency-vault
          certificate-profile-name: emergency-vault-public
          files-folder: ${{ github.workspace }}/frontend/auth-client/installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Rename installer with version
        shell: bash
        working-directory: frontend/auth-client/installer
        run: mv EmergencyVaultSetup.exe "EmergencyVault-Setup-v${{ steps.version.outputs.version }}.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Emergency Vault Desktop v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: frontend/auth-client/installer/EmergencyVault-Setup-v${{ steps.version.outputs.version }}.exe
